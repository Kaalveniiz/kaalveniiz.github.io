<head>

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>True | HALPHAS KREUZ.blog</title>

</head>
<body>
  <main class="win">
    <div class="title">┌ HALPHAS KREUZ.blog ────────────────────────────────────────────────┐</div>
    <section class="shell">
      <aside class="left">├ INDEX TREE
│
├─ ▸ <a href="/">Home</a>
├─ ▾ Posts
│  ├─ ▸ <a href="/posts/">Latest</a>
│  ├─ ▸ <a href="/posts/">Archive</a>
│  └─ ▸ <a href="/tags/">Tags</a>
└─ ▸ <a href="/about/">About</a>
</aside>
      <article class="right">
<pre>┌ True
│
└─ Entries</pre>
<ul class="post-list">
  
  <li>└─ no entries</li>
  
</ul>
</article>
    </section>
    <footer class="status">Status: online | time: <span id="status-clock">--:--:--</span></footer>
  </main>
  <script>
    (function () {
      function pad(n) { return String(n).padStart(2, "0"); }
      function tick() {
        var el = document.getElementById("status-clock");
        if (!el) return;
        var d = new Date();
        el.textContent =
          d.getFullYear() + "-" +
          pad(d.getMonth() + 1) + "-" +
          pad(d.getDate()) + " " +
          pad(d.getHours()) + ":" +
          pad(d.getMinutes()) + ":" +
          pad(d.getSeconds());
      }
      tick();
      if (window.setInterval) window.setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
