name: Build Hugo To Root (User Site)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "about/**"
      - "css/**"
      - "posts/**"
      - "tags/**"
      - "index.html"
      - "index.xml"
      - "sitemap.xml"
      - "404.html"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.128.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://kaalveniiz.net/"

      - name: Sync generated site to repository root
        run: |
          rm -rf about css posts tags
          rm -f index.html index.xml sitemap.xml 404.html
          cp -R public/* ./

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync generated site output"
          git push
