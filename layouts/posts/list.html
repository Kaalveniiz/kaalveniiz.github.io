{{ define "main" }}
<pre>┌ Latest
│
└─ Recent Posts</pre>
<ul class="post-list">
  {{ range first 10 ((where .Site.RegularPages "Section" "posts").ByDate.Reverse) }}
  <li>├─ <a href="{{ .RelPermalink }}">{{ .Title }}</a> ({{ .Date.Format "2006-01-02" }})</li>
  {{ else }}
  <li>└─ no posts yet</li>
  {{ end }}
</ul>
{{ end }}
