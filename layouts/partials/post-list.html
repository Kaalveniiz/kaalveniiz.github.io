{{- $pages := . -}}
<ol class="post-list">
  {{ range $pages }}
  <li class="post-item">
    <div class="post-main">
      <a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .GetTerms "tags" }}
      <div class="post-topic">Topic: {{ range $index, $tag := . }}{{ if $index }}, {{ end }}<a href="{{ $tag.RelPermalink }}">{{ $tag.LinkTitle }}</a>{{ end }}</div>
      {{- end }}
    </div>
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  </li>
  {{ else }}
  <li class="empty-state">No posts yet.</li>
  {{ end }}
</ol>
